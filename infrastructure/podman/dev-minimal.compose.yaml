# Local development only. Production uses separately managed credentials and services.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: marid_owner
      POSTGRES_PASSWORD: ${MARID_DB_OWNER_PASSWORD:?set MARID_DB_OWNER_PASSWORD}
      POSTGRES_DB: marid
      MARID_APP_PASSWORD: ${MARID_DB_APP_PASSWORD:?set MARID_DB_APP_PASSWORD}
    ports:
      - "127.0.0.1:${MARID_DB_HOST_PORT:-5432}:5432"
    volumes:
      - marid-postgres:/var/lib/postgresql/data
      - ./postgres/00_init.sh:/docker-entrypoint-initdb.d/00_init.sh:ro
      - ../../tests/tenancy/rls.sql:/opt/marid/tests/rls.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marid_owner -d marid"]
      interval: 5s
      timeout: 3s
      retries: 10
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: marid-dev-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${MARID_KEYCLOAK_ADMIN_PASSWORD:?set MARID_KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${MARID_KEYCLOAK_HOST_PORT:-8080}:8080"
    mem_limit: 1g
    volumes:
      - marid-keycloak-dev:/opt/keycloak/data
volumes:
  marid-postgres:
  marid-keycloak-dev:
